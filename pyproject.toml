[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "japanese-writing-verifier"
version = "2.0.0rc2"
description = "Deterministic checks for Japanese prose revisions"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
jw = "jw.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jw = ["contracts/*.json"]
